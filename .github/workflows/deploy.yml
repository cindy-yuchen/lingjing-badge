name: Deploy to Cloudflare Pages

# 每次向 main 分支 push 时，自动构建前端 + 部署 Functions 到 Cloudflare Pages。
# 密钥只存在 GitHub Secrets 中，绝不写入仓库或前端代码。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          # 由 GitHub Secrets 注入，见仓库 Settings → Secrets and variables → Actions
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=lingjing-badge
